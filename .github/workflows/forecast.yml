name: Update forecast

on:
  schedule:
    - cron: "17 14-23,0 * * *"   # hourly through the flying day: 6 am-4 pm PST / 7 am-5 pm PDT (HRRR updates hourly)
    - cron: "17 2-12/2 * * *"    # every 2 hours overnight
  workflow_dispatch: {}       # "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Restore last good model runs
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: om-${{ github.run_id }}
          restore-keys: om-
      - name: Build forecast
        run: python -u scripts/build_forecast.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional: Claude summary of the NWS discussion
      - name: Keep model runs for next time
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: om-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Commit data
        run: |
          git config user.name "forecast-bot"
          git config user.email "forecast-bot@users.noreply.github.com"
          git add data/forecast.json data/history data/trend.json data/archive data/modellog
          git diff --cached --quiet && exit 0
          git commit -m "Forecast update $(date -u +%Y-%m-%dT%H:%MZ)"
          # if files were committed while the job ran, take them in first, then save
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
