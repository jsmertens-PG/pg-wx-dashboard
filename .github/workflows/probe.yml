name: probe (temporary)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir out
          python3 - <<'PY'
          import json, sys
          sys.path.insert(0, "scripts")
          import build_forecast as bf
          site = [{"lat": 32.98796, "lon": -117.12232, "lz_ft": 750, "launch_ft": 1050, "id": "lb"}]
          hv = bf.SURFACE_VARS + ["boundary_layer_height"] + bf.level_vars(bf.DET_LEVELS)
          rep = {}
          for mid in ["ncep_rrfs_conus", "ncep_hrrr_conus"]:
              for extra in ["", "&forecast_days=7"]:
                  url = bf.om_url("https://api.open-meteo.com/v1/forecast", site, mid, hv) + extra
                  try:
                      d = bf.http_json(url)
                      d = d[0] if isinstance(d, list) else d
                      h = d["hourly"]; t = h["time"]
                      days = {}
                      for k, v in h.items():
                          if k == "time": continue
                          for ti, x in zip(t, v):
                              if x is not None:
                                  days.setdefault(k, set()).add(ti[:10])
                      rep[mid + extra] = {"url": url, "n_times": len(t), "first": t[0], "last": t[-1],
                                          "days_with_data": {k: sorted(v) for k, v in days.items()},
                                          "vars_all_null": [k for k in h if k != "time" and k not in days]}
                  except Exception as e:
                      rep[mid + extra] = {"url": url, "error": str(e)}
          json.dump(rep, open("out/rrfs.json", "w"), indent=1)
          PY
          cd out && git init -q && git checkout -q -b probe && git add . && git -c user.name=probe -c user.email=probe@x commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe
