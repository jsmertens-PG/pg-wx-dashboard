name: probe (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sSL -A "Mozilla/5.0" https://www.soaringpredictor.info/windgram/windmain.htm -o w.htm
          echo "=== size"; wc -c w.htm
          echo "=== links"; grep -o -i -E '(href|src|value)="[^"]*"' w.htm | sort -u
          echo "=== scripts"; grep -i -E -A3 '<script|<select|<iframe|North:|South:' w.htm | head -200
