name: probe (temporary)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out && cd out
          for n in S_SCAL_LittleBlack_windgram S_SCAL+1_LittleBlack_windgram S_SCAL+2_LittleBlack_windgram S_SCAL+1_Elsinore_windgram; do
            curl -sSL -A "Mozilla/5.0" -D "$n.hdr" "https://www.soaringpredictor.com/windgram/data/$n.png" -o "$n.png" || true
          done
          ls -la
          git init -q && git checkout -q -b probe && git add . && git -c user.name=probe -c user.email=probe@x commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe
