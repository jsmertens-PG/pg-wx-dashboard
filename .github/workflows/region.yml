name: Update SD region panel

on:
  schedule:
    - cron: "27 13-23/2 * * *"   # every 2 h through the flying day (PST 5:27 am - 3:27 pm); 5 models, keeps the Open-Meteo budget
    - cron: "27 3-12/3 * * *"    # every 3 hours overnight
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: region
  cancel-in-progress: false

jobs:
  region:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore last global model runs
        uses: actions/cache/restore@v4
        with:
          path: cache/region
          key: region-${{ github.run_id }}
          restore-keys: region-
      - name: Build SD region panel data
        run: python -u scripts/region/build_region.py
      - name: Keep global model runs for next time
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache/region
          key: region-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Commit data
        run: |
          git config user.name "forecast-bot"
          git config user.email "forecast-bot@users.noreply.github.com"
          git add data/region
          git diff --cached --quiet && exit 0
          git commit -m "Region update $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
