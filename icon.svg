<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#10241a"/>
      <stop offset="1" stop-color="#050807"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4fc072" stop-opacity="0"/>
      <stop offset="1" stop-color="#4fc072" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3e9e6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- radar scope -->
  <g fill="none" stroke="#4fc072" stroke-width="5">
    <circle cx="256" cy="256" r="200" stroke-opacity=".55"/>
    <circle cx="256" cy="256" r="140" stroke-opacity=".45"/>
    <circle cx="256" cy="256" r="80" stroke-opacity=".38"/>
    <path d="M256 56 V456 M56 256 H456" stroke-opacity=".22" stroke-width="3"/>
  </g>
  <!-- sweep wedge, up and to the right -->
  <path d="M256 256 L256 56 A200 200 0 0 1 425 149 Z" fill="url(#sweep)"/>
  <path d="M256 256 L425 149" stroke="#8ff0ac" stroke-width="6" stroke-linecap="round"/>
  <!-- echoes -->
  <circle cx="340" cy="150" r="10" fill="#8ff0ac"/>
  <circle cx="372" cy="214" r="7" fill="#4fc072"/>
  <!-- white cumulus with a flat base, sitting on the scope -->
  <g fill="url(#cloud)">
    <circle cx="200" cy="300" r="62"/>
    <circle cx="270" cy="262" r="78"/>
    <circle cx="340" cy="308" r="56"/>
    <circle cx="150" cy="336" r="42"/>
    <rect x="108" y="318" width="288" height="60" rx="30"/>
  </g>
</svg>
