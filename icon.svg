<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="scope" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#143a26"/>
      <stop offset="1" stop-color="#07140d"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5fdc8a" stop-opacity="0"/>
      <stop offset="1" stop-color="#5fdc8a" stop-opacity=".6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="#030605"/>
  <!-- round radar scope -->
  <circle cx="256" cy="256" r="236" fill="url(#scope)"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="#5fdc8a" stroke-width="10" stroke-opacity=".8"/>
  <g fill="none" stroke="#5fdc8a" stroke-width="5">
    <circle cx="256" cy="256" r="160" stroke-opacity=".45"/>
    <circle cx="256" cy="256" r="84" stroke-opacity=".38"/>
    <path d="M256 20 V492 M20 256 H492" stroke-opacity=".22" stroke-width="3"/>
  </g>
  <!-- sweep -->
  <path d="M256 256 L256 20 A236 236 0 0 1 460 138 Z" fill="url(#sweep)"/>
  <path d="M256 256 L460 138" stroke="#9cf5b8" stroke-width="7" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="9" fill="#9cf5b8"/>
  <!-- echo -->
  <circle cx="190" cy="330" r="9" fill="#5fdc8a" fill-opacity=".8"/>
  <!-- small white cumulus on the scope -->
  <g fill="#ffffff">
    <circle cx="322" cy="168" r="34"/>
    <circle cx="358" cy="150" r="42"/>
    <circle cx="396" cy="172" r="30"/>
    <rect x="300" y="166" width="118" height="36" rx="18"/>
  </g>
</svg>
