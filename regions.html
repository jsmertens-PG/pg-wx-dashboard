<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Regions (experimental) – SoCal Flying Radar</title>
<link rel="icon" href="regions-icon-192.png">
<link rel="apple-touch-icon" href="regions-apple-touch-icon.png">
<link rel="manifest" href="regions.webmanifest">
<meta name="apple-mobile-web-app-title" content="SD Regions">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--bg:#f3f4f6}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Inter,Roboto,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));background:#fff;border-bottom:1px solid var(--line);gap:8px}
h1{font-size:17px;margin:0;font-weight:700}
h1 small{font-size:11px;font-weight:600;color:#b45309;background:#fef3c7;border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:2px}
.back{font-size:13px;color:var(--ink);text-decoration:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;white-space:nowrap}
#map{flex:1;min-height:0;background:#eef1f4;padding:6px;display:flex;align-items:center;justify-content:center}
#map > svg{display:block;border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px -12px rgba(0,0,0,.2)}

#map .rg:hover circle{stroke-width:2.6}
.days{display:flex;gap:4px;justify-content:center;padding:8px 8px;padding-bottom:max(8px,env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);overflow-x:auto}
.days button{flex:1 1 0;min-width:0;max-width:92px;font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:#fff;padding:4px 4px 5px;border-radius:10px;color:var(--muted);text-align:center}
.days button b{display:block;font-size:10px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.days button .mm{display:block;width:100%;aspect-ratio:800/1212;border-radius:6px;overflow:hidden;margin-bottom:3px;border:1px solid #e5e7eb}
.days button .mm svg{display:block;width:100%;height:100%}
.days button .dl{display:block;font-size:12.5px;font-weight:700;color:var(--ink);line-height:1.15}
.days button[aria-pressed="true"]{background:#fff;color:var(--ink);border-color:var(--ink);box-shadow:0 0 0 1.5px var(--ink)}
.days button[aria-pressed="true"] .dl{color:var(--ink)}
/* region labels on the map */
.rlab{background:rgba(255,255,255,.92);border-radius:8px;padding:3px 7px;box-shadow:0 1px 3px rgba(0,0,0,.18);font-size:11.5px;line-height:1.2;text-align:center;white-space:nowrap;pointer-events:none}
.rlab b{display:block;font-size:12px}
.rlab span{color:#374151}
.lm{font-size:11px;font-weight:600;color:#1f2937;white-space:nowrap;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;pointer-events:none}
.lm.site{color:#b45309}
.lm.town{font-weight:500;color:#374151}
.lm.peak{font-weight:500;color:#4b5563;font-style:italic}
.key{background:rgba(255,255,255,.95);border-radius:8px;padding:6px 8px;font-size:10.5px;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.key i{display:inline-block;width:20px;height:10px;margin-right:1px;vertical-align:-1px}
/* region view, like XCTherm's pop-up */
.ov{position:fixed;inset:0;background:rgba(17,24,39,.45);display:none;z-index:2000;padding:12px;padding-top:max(12px,env(safe-area-inset-top));overflow:auto}
.ov.open{display:block}
.sheet{position:relative;max-width:1040px;margin:0 auto;background:#fff;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.3);overflow:hidden}
.bar{display:flex;align-items:center;justify-content:center;position:relative;height:38px;border-bottom:1px solid var(--line)}
.x{position:absolute;right:4px;top:1px;border:0;background:none;font-size:28px;line-height:1;color:#9ca3af;cursor:pointer;padding:4px 10px}
.tg{display:flex;align-items:center;gap:7px;font-size:13px;color:#374151}
.tg button{width:40px;height:22px;border-radius:999px;border:0;background:#1f2328;position:relative;padding:0;cursor:pointer}
.tg button i{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.tg button[aria-checked="true"] i{left:21px}
.scroll svg{display:block;width:100%;height:auto}
.dnav{display:flex;align-items:center;justify-content:center;gap:10px;padding:8px 10px 10px;border-top:1px solid var(--line)}
.dnav button{width:44px;height:36px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:24px;line-height:1;color:var(--ink);cursor:pointer}
.dnav button:disabled{opacity:.3;cursor:default}
.dnav span{min-width:150px;text-align:center;font-weight:700;font-size:15px}
.sum{font-size:13px;line-height:1.4;padding:8px 12px;border-top:1px solid var(--line);color:#374151}
.tt{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.tt th{text-align:left;font-size:11px;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
.tt td{padding:7px 8px;border-bottom:1px solid #f0f1f3;vertical-align:top}
.tt td:first-child{white-space:nowrap;font-weight:600}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
@media (max-width:560px){.tg{font-size:12px}.tt{font-size:12px}.tt td:nth-child(5),.tt th:nth-child(5){display:none}}
</style></head><body>
<header><h1>Regions<small>experimental</small></h1><a class="back" href="./">← Radar</a></header>
<div id="map"></div>
<nav class="days" id="days"></nav>
<div class="ov" id="ov"><div class="sheet"><div class="bar"><div class="tg"><span>Text</span><button type="button" id="tog" role="switch" aria-checked="true" aria-label="Graphic view"><i></i></button><span>Graphic</span></div><button class="x" id="x" aria-label="Close">×</button></div>
  <div id="view"></div><div class="sum" id="sum"></div>
  <div class="dnav"><button type="button" id="prev" aria-label="Previous day">‹</button><span id="dlab"></span><button type="button" id="next" aria-label="Next day">›</button></div></div></div>
<script src="scripts/region/panel.js?v=202611071045"></script>
<script src="scripts/region/regionmap.js?v=202611070900"></script>
<script>
let RADAR = null;
let D = null, day = 0, graphic = true, openR = null;
try { graphic = localStorage.getItem('region_view') !== 'text'; } catch (e) {}
// one tap handler for the map (survives redraws): a tap anywhere in a region opens it
document.getElementById('map').addEventListener('click', e => {
  const g = e.target.closest && e.target.closest('.rg');
  if (g && D) openRegion(D.regions.find(r => r.id === g.dataset.id));
});
// size the map in pixels to the space between header and day bar (percent heights are unreliable on phones)
function fitMap() {
  const m = document.getElementById('map'), sv = m.querySelector('svg');
  if (!sv) return;
  const vb = sv.viewBox.baseVal, aspect = vb.height / vb.width;
  const cs = getComputedStyle(m), padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight), padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
  const availW = m.clientWidth - padX, availH = m.clientHeight - padY;
  const w = Math.max(200, Math.min(availW, availH / aspect));
  sv.style.width = w + 'px'; sv.style.height = (w * aspect) + 'px';
}
window.addEventListener('resize', fitMap);
window.addEventListener('orientationchange', () => setTimeout(fitMap, 200));
function draw() {
  const m = document.getElementById('map');
  m.innerHTML = mapSVG(D, day, RADAR);
  fitMap();
  document.querySelectorAll('#days button').forEach((b, i) => b.setAttribute('aria-pressed', String(i === day)));
  if (openR) openRegion(openR);
}
function openRegion(r) {
  openR = r;
  const di = Math.min(day, r.days.length - 1);
  const vd = radarVerdict(RADAR, r.id, r.days[di]?.date);
  const data = { generated: D.generated, title: r.title, region: r.name, points: r.points, days: r.days, verdict: vd, marks: r.marks, floor_ft: r.floor_ft,
    windRows: r.id === 'palmsj' ? [['10k', 'w10k', '10,000 ft'], ['5k', 'w5k', '5,000 ft'], ['G', 'sfc', 'ground (10 m)']] : null };
  document.getElementById('tog').setAttribute('aria-checked', String(graphic));
  document.getElementById('view').innerHTML = graphic ? `<div class="scroll">${panelSVG(data, di)}</div>`
    : `<div style="padding:10px 10px 4px"><div style="font-weight:800;font-size:22px">${r.title}</div>${panelText(data, di)}</div>`;
  const s = r.days[di] && r.days[di].summary;
  const dir = a => ['N','NE','E','SE','S','SW','W','NW'][Math.round(a / 45) % 8];
  const hh = h => (h === 12 ? '12' : h > 12 ? h - 12 : h);
  document.getElementById('sum').innerHTML = (vd ? `<b style="color:${vd.color}">●</b> <b>Radar: ${vd.site} ${vd.score.toFixed(1).replace('.0', '')}/5, ${vd.label}</b>${vd.why ? ` (${vd.why})` : ''}. Thermals: ` : '') + (s ? `<b>${r.days[di].label}, best ${hh(s.window[0])}–${hh(s.window[1] + 1)} ${s.window[1] + 1 >= 12 ? 'pm' : 'am'}:</b> climbs ~${s.climb.toFixed(1)} m/s, usable to ~${s.top_ft.toLocaleString('en-US')} ft${s.cu && s.base_ft ? `, cumulus from ${s.base_ft.toLocaleString('en-US')} ft` : ', blue'}${s.w5k && s.w5k[1] != null ? `; wind at 5k ft ${dir(s.w5k[0])} ${s.w5k[1]} mph` : ''}. Points: ${r.points.map(p => p.name).join(', ')}.` : 'No thermals forecast.');
  const n = r.days.length, cur = r.days[di];
  const dt = cur ? new Date(cur.date + 'T12:00:00') : null;
  document.getElementById('dlab').textContent = dt ? `${cur.label === 'Today' || cur.label === 'Tomorrow' ? cur.label + ', ' : ''}${dt.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' })}` : '';
  document.getElementById('prev').disabled = di <= 0;
  document.getElementById('next').disabled = di >= n - 1;
  document.getElementById('ov').classList.add('open');
}
document.getElementById('prev').onclick = () => { if (day > 0) { day--; draw(); } };
document.getElementById('next').onclick = () => { if (openR && day < openR.days.length - 1) { day++; draw(); } };
document.getElementById('x').onclick = () => { document.getElementById('ov').classList.remove('open'); openR = null; };
document.getElementById('ov').onclick = e => { if (e.target.id === 'ov') document.getElementById('x').onclick(); };
document.getElementById('tog').onclick = () => { graphic = !graphic; try { localStorage.setItem('region_view', graphic ? 'graphic' : 'text'); } catch (e) {} if (openR) openRegion(openR); };
(async () => {
  try {
    D = await (await fetch('data/region/regions.json?' + Date.now())).json();
    try { RADAR = await (await fetch('data/forecast.json?' + Date.now())).json(); } catch (e) { RADAR = null; }
    const n = Math.max(...D.regions.map(r => r.days.length));
    const ref = D.regions.find(r => r.days.length === n);
    const renderDays = () => {
      document.getElementById('days').innerHTML = ref.days.map((d, i) => {
        const dt = new Date(d.date + 'T12:00:00');
        const wd = i === 0 && d.label === 'Today' ? 'Today' : dt.toLocaleDateString('en-US', { weekday: 'short' });
        return `<button type="button" title="${d.label} · ${(d.models || []).join(' + ')}">${typeof miniMapSVG === 'function' ? `<span class="mm">${miniMapSVG(D, i, RADAR)}</span>` : ''}<span class="dl">${wd}<b>${dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}</b></span></button>`;
      }).join('');
    };
    renderDays();
    document.querySelectorAll('#days button').forEach((b, i) => b.onclick = () => { day = i; draw(); });
    draw();
  } catch (e) { document.getElementById('map').innerHTML = '<p style="padding:20px">Could not load regions: ' + e.message + '</p>'; }
})();
</script></body></html>
